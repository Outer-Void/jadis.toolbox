# Default policy for running JADIS Toolbox through BLUX. Read-only inspection only; nothing here grants writes.
contract: blux.policy
contract_version: "1.0"
policy_id: jadis-toolbox-default
default_effect: deny
rules:
  - rule_id: allow-read-only-inspection
    effect: allow
    capabilities: ["environment.*", "toolchain.inspect"]
    actor_types: [user, service, agent]
    max_side_effects: read
    grants: ["workstation:read"]
